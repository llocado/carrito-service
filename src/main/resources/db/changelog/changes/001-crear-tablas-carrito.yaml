databaseChangeLog:
  - changeSet:
      id: 001-crear-tabla-carritos
      author: supermercado
      changes:
        - createTable:
            tableName: carritos
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_carritos
                    nullable: false
              - column:
                  name: usuario_id
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_carritos_usuario_id
              - column:
                  name: creado_en
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: actualizado_en
                  type: timestamp with time zone
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-crear-tabla-items-carrito
      author: supermercado
      changes:
        - createTable:
            tableName: items_carrito
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_items_carrito
                    nullable: false
              - column:
                  name: carrito_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_items_carrito_carrito
                    references: carritos(id)
              - column:
                  name: producto_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: nombre
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: precio_unitario
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: moneda
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: cantidad
                  type: integer
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: items_carrito
            columnNames: carrito_id, producto_id
            constraintName: uk_items_carrito_carrito_producto
