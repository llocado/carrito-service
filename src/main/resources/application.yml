spring:
  application:
    name: carrito-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:carrito_db}
    username: ${DB_USER:carrito_user}
    password: ${DB_PASSWORD:carrito_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Con la base caida, falla en 5 s (por defecto 30 s) en vez de dejar hilos y reintentos esperando.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Liquibase; Hibernate solo valida que las
      # entidades coincidan con lo que Liquibase ya creo.
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm de Keycloak levantado por supermercado-infra.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/supermercado}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:supermercado}
    password: ${RABBITMQ_PASSWORD:supermercado}
    # Con RabbitMQ inalcanzable falla en 5 s (por defecto ~60 s) en vez de dejar hilos esperando.
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    listener:
      simple:
        # Un mensaje que falla NUNCA se reencola: tras los reintentos va a la DLQ.
        default-requeue-rejected: false
        # 1 intento original + 3 reintentos (esperas de 1s, 2s y 4s); luego va a la DLQ.
        # Los rechazos definitivos (payload invalido) no se reintentan: ver RabbitMQConfig.
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

app:
  cors:
    # Origenes (separados por coma) cuyas paginas web pueden llamar a esta API desde el navegador. Por defecto, solo el
    # servidor de desarrollo de tienda-web. En produccion: el dominio real de la tienda (nunca "*").
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8081}

# URL base de productos-service, usada por el cliente REST sincrono que
# obtiene nombre/precio al agregar un producto al carrito.
productos-service:
  base-url: ${PRODUCTOS_SERVICE_URL:http://localhost:8080}
  connect-timeout: ${PRODUCTOS_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${PRODUCTOS_SERVICE_READ_TIMEOUT:5s}

purga:
  # Retencion de eventos_procesados (idempotencia): una pasada al dia. El plazo debe ser mayor que lo que un duplicado
  # puede esperar en una cola (por ejemplo, con un consumidor caido).
  cron: ${PURGA_CRON:0 30 3 * * *}
  eventos-procesados-dias: ${PURGA_EVENTOS_PROCESADOS_DIAS:30}
  lote: ${PURGA_LOTE:1000}

logging:
  level:
    root: INFO
    com.supermercado: INFO
    # Este handler escribe ~90 lineas de stack trace por cada mensaje rechazado; el listener ya registra
    # una linea concisa con el eventId, y los fallos tras los reintentos los registra RejectAndDontRequeueRecoverer.
    org.springframework.amqp.listener.ConditionalRejectingErrorHandler: ERROR
  pattern:
    # Agrega [requestId|correlationId] y reemplaza saltos de linea en el mensaje:
    # evita que un valor controlado por un cliente falsifique lineas de log.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:-}){magenta} %clr(---){faint} ${LOGGED_APPLICATION_NAME:-}%clr([%15.15t]){faint} %clr([%X{requestId:-}|%X{correlationId:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%m){'[\\r\\n]','_'}%n%wEx"
